# UC-2 系外行星场景（宿主星模型侧；凌星光变生成属模型段物理引擎职责）
# 关联：UR-003/004/011；预期：Schema 校验通过；P4 走查光变+光谱组合场景的表达
oasis_version: "1.0"
theme: "exoplanet"
source:
  name: "host_star"
  coordinates:
    ra: {value: 291.377, unit: "deg"}
    dec: {value: 38.783, unit: "deg"}
    distance: {value: 52.4, unit: "pc"}
  proper_motion:
    pm_ra_cosdec: {value: -4.8, unit: "mas/yr"}
    pm_dec: {value: 80.0, unit: "mas/yr"}
  spectral_model:
    type: "blackbody"
    parameters:
      temperature: {value: 5700, unit: "K"}
transmission:
  name: "no_ism"
  optical_depth: {value: 0.02, unit: ""}
  spectral_model:
    type: "power_law"
    parameters:
      alpha: {value: -1.3, unit: ""}
      reference_wavelength: {value: 5500, unit: "angstrom"}
